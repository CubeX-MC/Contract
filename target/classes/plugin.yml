name: Contracts
version: 0.1.0
main: org.cubexmc.contracts.ContractsPlugin
api-version: '1.18'
author: CubeX-MC
description: Player-to-player contract board with Vault-backed escrow.
depend: [Vault]

commands:
  contract:
    description: Contracts root command.
    aliases: [contracts, ct]
    usage: /contract help

permissions:
  contracts.use:
    default: true
    description: Open and inspect the contract board.
  contracts.create:
    default: true
    description: Create service, wager, and partnership contracts.
  contracts.accept:
    default: true
    description: Accept open contracts.
  contracts.submit:
    default: true
    description: Submit accepted contracts for owner approval.
  contracts.approve:
    default: true
    description: Approve submitted contracts you own.
  contracts.cancel:
    default: true
    description: Cancel eligible contracts.
  contracts.dispute:
    default: true
    description: Open a dispute for eligible contracts.
  contracts.mediate:
    default: true
    description: Accept mediator duties and resolve contracts you mediate.
  contracts.admin:
    default: op
    description: Contracts administration.
    children:
      contracts.admin.reload: true
      contracts.admin.settle: true
      contracts.admin.view: true
  contracts.admin.reload:
    default: op
    description: Reload Contracts.
  contracts.admin.settle:
    default: op
    description: Force pay, refund, or close contracts.
  contracts.admin.view:
    default: op
    description: View all contracts.
